name: Build DSR Apps widget

on:
  push:
    paths:
      - 'DSRAppsWidget/**'
      - '.github/workflows/dsr-apps-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DSRAppsWidget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DSR-Apps-Widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DSR-Apps-Widget
          path: DSRAppsWidget/DSR-Apps-Widget.apk
      - name: Publish to "widget-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-latest
          name: DSR Apps widget (latest build)
          prerelease: true
          files: DSRAppsWidget/DSR-Apps-Widget.apk
